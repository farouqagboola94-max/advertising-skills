name: Daily Business Health Check

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate report
        id: report
        env:
          BITLY_TOKEN: ${{ secrets.BITLY_TOKEN }}
          BITLY_LINK: ${{ secrets.BITLY_LINK }}
          SEMRUSH_API_KEY: ${{ secrets.SEMRUSH_API_KEY }}
          SEMRUSH_DOMAIN: ${{ secrets.SEMRUSH_DOMAIN }}
          QUICKBOOKS_ACCESS_TOKEN: ${{ secrets.QUICKBOOKS_ACCESS_TOKEN }}
          SUPERMETRICS_API_KEY: ${{ secrets.SUPERMETRICS_API_KEY }}
        run: node scripts/daily-report.js > report.md

      - name: Open report issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Business Health Check — ${date}`,
              body,
              labels: ['daily-report'],
            });
